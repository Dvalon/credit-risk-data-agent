[project]
name = "credit-risk-data-agent"
version = "0.1.0"
description = "Phase 1 star schema for LendingClub accepted-loan credit-risk analytics."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "duckdb==2.0.1",
    "kaggle==2.2.5",
    "pandas==3.1.1",
    "python-dotenv==1.2.4",
    "six==1.17.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
